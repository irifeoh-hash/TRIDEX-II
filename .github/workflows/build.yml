name: Build plugins

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # lets the publish job create the Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-15-intel   # universal build; Intel runners are less congested than arm64
            name: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            # Universal binary: native on Apple Silicon and Intel Macs
            cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            cmake --build build --config Release --parallel 4 --target Tridex80_VST3 Tridex80_AU
          else
            cmake --build build --config Release --parallel 4 --target Tridex80_VST3
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          ART=$(find build -type d -path "*Tridex80_artefacts/Release" | head -1)
          cp -R "$ART/VST3/Tridex II.vst3" dist/
          cat > dist/README.txt <<'TXT'
          Tridex II - Windows 64-bit VST3

          1. Copy the whole "Tridex II.vst3" folder into:
               C:\Program Files\Common Files\VST3
          2. Rescan plugins in your DAW (FL Studio: Options > Manage plugins > Find installed plugins).
             It appears as an instrument: "Tridex Audio - Tridex II".
          TXT
          cd dist && 7z a -tzip ../TridexII-Windows-VST3.zip "Tridex II.vst3" README.txt

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          ART=$(find build -type d -path "*Tridex80_artefacts/Release" | head -1)
          cp -R "$ART/VST3/Tridex II.vst3" dist/
          cp -R "$ART/AU/Tridex II.component" dist/
          # Ad-hoc signature (required to load on Apple Silicon; no Apple developer ID involved)
          codesign --force --deep -s - "dist/Tridex II.vst3"
          codesign --force --deep -s - "dist/Tridex II.component"
          lipo -info "dist/Tridex II.vst3/Contents/MacOS/Tridex II"
          cat > dist/README.txt <<'TXT'
          Tridex II - macOS (Apple Silicon + Intel) VST3 and Audio Unit

          1. Copy "Tridex II.vst3"      into  ~/Library/Audio/Plug-Ins/VST3
             Copy "Tridex II.component" into  ~/Library/Audio/Plug-Ins/Components   (Logic Pro / GarageBand)
             (In Finder: Go > Go to Folder... and paste the path.)
          2. These files are not notarized by Apple, so macOS blocks them at first.
             Open Terminal and run these two lines once:
               xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/VST3/"Tridex II.vst3"
               xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/Components/"Tridex II.component"
          3. Restart your DAW and rescan plugins. In Logic it appears under
             AU Instruments > Tridex Audio > Tridex II.
          TXT
          (cd dist && zip -qry ../TridexII-macOS.zip "Tridex II.vst3" "Tridex II.component" README.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: Tridex-${{ matrix.name }}
          path: TridexII-*.zip

  # Publish whatever built (Windows and/or macOS) as the "tridex-ii-latest" Release.
  publish:
    needs: build
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One publish at a time, and only the newest commit on main publishes (an older run finishing
    # late must not replace a newer build).
    concurrency:
      group: publish-release
      cancel-in-progress: false
    steps:
      - name: Check this is still the newest commit
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_SHA=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$HEAD_SHA" = "$GITHUB_SHA" ]; then echo "latest=true" >> "$GITHUB_OUTPUT"
          else echo "latest=false" >> "$GITHUB_OUTPUT"; echo "main is now $HEAD_SHA; its own run will publish."; fi
      - uses: actions/download-artifact@v4
        if: steps.head.outputs.latest == 'true'
        with:
          path: artifacts
          merge-multiple: true
      - name: Create Release
        if: steps.head.outputs.latest == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la artifacts
          gh release delete tridex-ii-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create tridex-ii-latest artifacts/*.zip --title "Tridex II (latest build)" \
            --notes "Windows: TridexII-Windows-VST3.zip (VST3). macOS: TridexII-macOS.zip (VST3 + AU, Apple Silicon and Intel). Install steps are in the README inside each zip." \
            --target "$GITHUB_SHA" --prerelease
