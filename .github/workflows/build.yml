name: Build VST3

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # lets the Windows job publish the download as a Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          # Add macOS / Linux here if ever needed:
          #   - os: macos-latest
          #     name: macOS
          #   - os: ubuntu-22.04
          #     name: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev ninja-build

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        run: cmake --build build --config Release --parallel 4 --target Tridex80_VST3

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          ART=$(find build -type d -path "*Tridex80_artefacts/Release" | head -1)
          cp -R "$ART/VST3/Tridex 80.vst3" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: Tridex80-${{ matrix.name }}
          path: dist

      # Windows: publish a ready-to-download zip as the "latest" Release.
      - name: Publish Windows download
        if: runner.os == 'Windows' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > dist/README.txt <<'TXT'
          Tridex 80 - Windows 64-bit VST3

          1. Copy the whole "Tridex 80.vst3" folder into:
               C:\Program Files\Common Files\VST3
          2. Rescan plugins in your DAW (FL Studio: Options > Manage plugins > Find installed plugins).
             It appears as an instrument: "Tridex Audio - Tridex 80".
          TXT
          cd dist && 7z a -tzip ../Tridex80-Windows-VST3.zip "Tridex 80.vst3" README.txt && cd ..
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest Tridex80-Windows-VST3.zip --title "Tridex 80 (latest build)" \
            --notes "Windows 64-bit VST3. Download Tridex80-Windows-VST3.zip below, unzip, copy 'Tridex 80.vst3' to C:\\Program Files\\Common Files\\VST3." \
            --target "$GITHUB_SHA" --prerelease
